<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stretch Timer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Stretch Timer</h1>

    <div>
        <p>Time Remaining: <span id="timer-display">30</span> seconds</p>
        <input type="range" id="time-slider" min="10" max="100" step="5" value="30">
        <div class="presets">
            <button class="preset" data-seconds="15">15s</button>
            <button class="preset" data-seconds="30">30s</button>
            <button class="preset" data-seconds="60">60s</button>
            <button class="preset" data-seconds="90">90s</button>
        </div>
    </div>

    <div>
        <button id="start-button">Start</button>
        <button id="stop-button">Stop</button>
        <button id="sound-toggle">🔊 Sound On</button>
        <button id="theme-toggle">🌙 Dark Mode</button>
        <button id="test-sound">Test Sound</button>
    </div>

    <div id="sound-picker" class="sound-picker" role="group" aria-label="Timer sound">
        <button class="sound-option" data-sound="beep">🔔 Nice Ding</button>
        <button class="sound-option" data-sound="chime">🔔 Bell (Long Tail)</button>
        <button class="sound-option" data-sound="alarm">🔔 Alarm (worker pick)</button>
    </div>

    <p class="hint">Tip: press Space to start/stop</p>

    <!-- Stretching animation GIF -->
    <div>
        <img id="stretch-gif" src="stretching.gif" alt="Stretching Animation" style="display: none; width: 200px;">
    </div>

    <!-- Fallback audio path (Web Audio is the primary path) -->
    <audio id="beep-sound" src="beep.wav" preload="auto"></audio>

    <script src="script.js"></script>
</body>
</html>
